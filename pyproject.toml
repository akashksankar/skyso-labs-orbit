[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skyso-orbit"
version = "1.0.0"
description = "Local-First Orbital Intelligence & Space Visualization Platform by Skyso Labs"
readme = "README.md"
authors = [{ name = "Skyso Labs", email = "research@skyso.org" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sgp4>=2.23",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
]

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orbit*"]
